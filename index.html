<div class="panel"><h3>Where the money comes from</h3><div class="row" style="flex-wrap:nowrap;margin-bottom:8px"><div style="flex:none">${pie(inc,96)}</div><div style="flex:1">${lg(inc,'ok')}</div></div><h3>Where the money goes</h3><div class="row" style="flex-wrap:nowrap"><div style="flex:none">${pie(out,96)}</div><div style="flex:1">${lg(out,'bd')}</div></div></div>
<div>${taxPanel(1)}<div class="panel"><h3>Debt over time</h3>${lineC(pts,95)}</div></div></div>`+abox('b','Try: "Cancel a project that costs too much" or "Raise taxes on the richest"')}

function pubFx(t){const l=t.toLowerCase();let d=0,why=[];[[/holiday|day off|long weekend/,4,'People love more holidays'],[/migrant|immigra|refugee|foreign worker|foreigners/,-4,'Many voters worry about migrants'],[/defen[cs]e|military|army|police|border|soldier|navy/,3,'Voters like strong defence'],[/tradition|heritage|temple|festival/,2,'Voters value Taiwan traditions'],[/\baid\b|abroad|overseas/,-2,'Some voters want money kept at home'],[/pension|elderly|older people|veteran|farmer/,2,'Voters support older people and farmers'],[/lower tax|cut tax|reduce tax/,2,'Lower taxes are popular'],[/raise tax|higher tax|increase tax|tax the/,-3,'Higher taxes are unpopular']].forEach(x=>{if(x[0].test(l)){d+=x[1];why.push(x[2])}});return{d,why}}

function hemi(cols){const N=cols.length||100,rr=[80,100,120,140,160],tot=600,cn=rr.map(r=>Math.round(N*r/tot));cn[4]+=N-cn.reduce((a,b)=>a+b);const pts=[];rr.forEach((r,i)=>{for(let j=0;j<cn[i];j++){const a=Math.PI*(1-j/(cn[i]-1));pts.push({a,x:200+r*Math.cos(a),y:182-r*Math.sin(a)})}});pts.sort((p,q)=>q.a-p.a);
return`<svg viewBox="0 0 400 196" style="max-width:460px;width:100%" role="img" aria-label="Seat chart">${pts.map((p,i)=>{const c=cols[i]||{c:'#888'};return c.o?`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.6" fill="none" stroke="${c.c}" stroke-width="2"/>`:`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5.4" fill="${c.c}"/>`}).join('')}<text x="200" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">${N}</text><text x="200" y="186" text-anchor="middle" font-size="11" fill="currentColor">seats</text></svg>`}

let AC=null;function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();return AC}
function murmur(){try{const A=ac(),n=A.sampleRate*3,buf=A.createBuffer(1,n,A.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const s=A.createBufferSource();s.buffer=buf;const f=A.createBiquadFilter();f.type='bandpass';f.frequency.value=600;f.Q.value=1.1;const g=A.createGain(),t=A.currentTime;g.gain.setValueAtTime(0,t);for(let i=1;i<=24;i++)g.gain.linearRampToValueAtTime(.04+Math.random()*.12,t+i*.12);g.gain.linearRampToValueAtTime(0,t+3.1);s.connect(f);f.connect(g);g.connect(A.destination);s.start()}catch(e){}}
function thump(){try{const A=ac(),o=A.createOscillator(),g=A.createGain(),t=A.currentTime;o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(50,t+.2);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(A.destination);o.start();o.stop(t+.35)}catch(e){}}

const iv=setInterval(()=>{k=Math.min(seats.length,k+4);const e=$('#vh');if(!e){clearInterval(iv);return}e.innerHTML=hemi(seats.map((s,i)=>i>=k?{c:'#8a8f99'}:s.y?{c:s.c}:{c:s.c,o:1}));const y=seats.slice(0,k).filter(s=>s.y).length;$('#vt').textContent=`Yes ${y}  |  No ${k-y}`;

const gs=q=>{let u=0,v=0;while(!u)u=q();while(!v)v=q();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function alloc(w,N){const s=w.reduce((a,b)=>a+b),ex=w.map(x=>x/s*N),fl=ex.map(Math.floor);let r=N-fl.reduce((a,b)=>a+b);ex.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,r).forEach(o=>fl[o[1]]++);return fl}
function runElection(){regInit();const q=mk(((G.seed||1)*131+G.max*17+G.turn*7)>>>0),c=G.elec.cand,sw=gs(q)*2.8,reg={},rv={},tot=[0,0,0];
MAP.forEach(m=>{const i=intent(m.id);let v=[i[0]+sw+gs(q)*3.2,i[1]-sw/2+gs(q)*3.2,i[2]-sw/2+gs(q)*3.2].map(x=>Math.max(2,x));const s=v[0]+v[1]+v[2];v=v.map(x=>Math.round(x/s*1000)/10);const votes=Math.round(m.pop*1e6*(.6+q()*.08));reg[m.id]=v;rv[m.id]=votes;v.forEach((x,k)=>tot[k]+=votes*x/100)});
const T=tot[0]+tot[1]+tot[2],pc=tot.map(x=>Math.round(x/T*1000)/10),win=tot[0]>=tot[1]&&tot[0]>=tot[2];let pv=[0,0,0],pt=0;MAP.forEach(m=>{G.reg[m.id].prev.forEach((x,k)=>pv[k]+=x*m.pop);pt+=m.pop});pv=pv.map(x=>x/pt);
const ci=CI(),swP=[sw,-sw/2,-sw/2],psw=G.ly.map((p,i)=>{const k=ci.indexOf(i);return(k>=0?swP[k]*.4:0)+gs(q)*2.2}),lyr={},lysh={},before=G.ly.map(p=>p.s);
MAP.forEach(m=>{const it=intentLY(m.id);let v=it.map((x,i)=>Math.max(.5,x+psw[i]+gs(q)*2.8));const s=v.reduce((a,b)=>a+b);v=v.map(x=>x/s*100);lysh[m.id]=v.map(x=>Math.round(x*10)/10);lyr[m.id]=alloc(v,G.rs[m.id])});
const after=G.ly.map((p,i)=>MAP.reduce((t,m)=>t+lyr[m.id][i],0));
G.es={win,pp:pc[0],a:pc[1],b:pc[2],t:G.max,reg,rv,tot:tot.map(Math.round),lyr,lysh,ly:{before,after,names:G.ly.map(p=>p.n),cols:G.ly.map(p=>p.c)},shown:false};G.ly.forEach((p,i)=>p.s=after[i]);save()}

else if(/invest|factory|compan|chip|build/.test(l)){G.b.rev+=1.2;stat('emp',2);ln.push(`${c.n} will invest in Taiwan. Yearly income [g:up ${nt(1.2)}]`,'Employment [g:▲ +2]');say='Our companies will invest in your country.';did=true}
else if(/secur|defen|coast guard|cyber|military|navy/.test(l)){stat('sec',4);ln.push('National security [g:▲ +4]');say='We will work together on security.';did=true}
else if(/climate|energy|environment|green|solar|wind/.test(l)){stat('env',3);ln.push('Environmental health [g:▲ +3]');say='We can share clean energy ideas.';did=true}
else if(/tech|science|research|student|school/.test(l)){stat('econ',2);stat('well',1);ln.push('Economic health [g:▲ +2]','Public wellbeing [g:▲ +1]');say='Our scientists will work together.';did=true}
else if(/tourist|tourism|visa|travel/.test(l)){G.b.rev+=.8;stat('appr',1);ln.push(`More visitors. Yearly income [g:up ${nt(.8)}]`,'Public approval [g:▲ +1]');say='More visitors will come to see your country.';did=true}
if(!did&&!ln.length)ln.push('International relations [g:▲ +2]');return{lines:ln,say}}

function premierTips(){const T=[],s=G.st,m=2*(G.max+1-G.turn),nd=G.bills.filter(b=>b.st=='Draft'),ln=n=>(G.ly.find(x=>x.n==n)||{lead:{n}}).lead.n;

if(G.b.debt>45||costs()-G.b.rev>3)T.push('We are spending more than we earn. Try a trade deal in Diplomacy, or raise taxes (voters will not like it).');
if(!Object.keys(G.trade||{}).length)T.push('We have no trade deals yet. A deal with a friendly country raises our income.');
if(s.trust<45)T.push('People do not trust the government much. Explain your choices at a press conference.');
if(s.well<45)T.push('People need better services. Schools, hospitals and homes help.');
if(s.econ<45)T.push('The economy is weak. Jobs, trade and technology can help.');
T.push('Click any indicator or region on this page to learn more.');return T.slice(0,3)}
